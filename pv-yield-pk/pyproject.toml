[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pvyield"
version = "2.0.0"
description = "Daily rooftop PV yield estimates and day-ahead forecasts for cities in Pakistan"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Tahreem Fatima" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "plotly>=5.20",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
app = ["streamlit>=1.50"]
fast = ["lightgbm>=4.3"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "streamlit>=1.50", "lightgbm>=4.3"]

[project.scripts]
pvyield = "pvyield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = ["network: hits the live NASA POWER API (run with -m network)"]
filterwarnings = ["ignore::DeprecationWarning:plotly.*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]
