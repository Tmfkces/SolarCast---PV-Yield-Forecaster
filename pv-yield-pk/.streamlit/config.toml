[server]
headless = true
address = "0.0.0.0"
port = 5000
enableCORS = false
enableWebsocketCompression = false

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "minimal"

# SolarCast follows the device's light/dark setting ("System" in Streamlit's
# Settings menu). Users can also pick Light or Dark there.
[theme]
baseRadius = "1rem"
font = "Poppins:https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"

[theme.light]
primaryColor = "#5B5BD6"
backgroundColor = "#F6F4FD"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#2B2A4C"

[theme.dark]
primaryColor = "#8B8BF5"
backgroundColor = "#0F1020"
secondaryBackgroundColor = "#181A2E"
textColor = "#ECEBFF"
